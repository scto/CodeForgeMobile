lifecycle = "2.8.6"
composeBom = "2025.09.00"
composeCompiler = "1.5.15"
material3Adaptive = "1.1.0"
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"
datastore = "1.1.1"
protobuf = "3.25.3"
protobufPlugin = "0.9.4"
coroutines = "1.9.0"
navigationCompose = "2.8.1"
jgit = "6.10.0.202406032230-r"
freemarker = "2.3.32"
gradleToolingApi = "8.9"
serialization = "1.7.1"
commonsCompress = "1.26.2"
xz = "1.9"
desugarJdkLibs = "2.1.3"
androidxAnnotation = "1.8.2"
bonsai = "1.2.0"
documentfile = "1.0.1"
activityCompose = "1.10.1"
startup = "1.2.0"
junit = "4.13.2"

# --- Termux-Vendoring (:libs:termux-*, siehe TERMUX-PORTING.md) ---
ndk = "26.3.11579264"
material = "1.12.0"
guava = "33.3.1-android"
markwon = "4.6.2"
hiddenApiBypass = "6.1"
androidxPreference = "1.2.1"
androidxDrawerlayout = "1.2.0"
androidxViewpager2 = "1.1.0"
androidxAppcompat = "1.7.0"
androidxWindow = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-proto = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
freemarker = { group = "org.freemarker", name = "freemarker", version.ref = "freemarker" }
gradle-tooling-api = { group = "org.gradle", name = "gradle-tooling-api", version.ref = "gradleToolingApi" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Bonsai: multiplatform Compose-Tree-View (https://github.com/adrielcafe/bonsai), Maven Central.
# bonsai-file-system liefert FileSystemTree/FileSystemBonsaiStyle für die Dateibaum-Anzeige
# als NavigationDrawer-Inhalt (siehe :feature:filetree/FileTreeScreen.kt).
bonsai-core = { group = "cafe.adriel.bonsai", name = "bonsai-core", version.ref = "bonsai" }
bonsai-file-system = { group = "cafe.adriel.bonsai", name = "bonsai-file-system", version.ref = "bonsai" }

# Für ProjectImportRepositoryImpl: DocumentFile.fromTreeUri() zum rekursiven Ablesen eines
# per SAF (ActivityResultContracts.OpenDocumentTree) ausgewählten Verzeichnisbaums.
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
# setContent (MainActivity) + rememberLauncherForActivityResult/ActivityResultContracts
# (ProjectImportRoute, SAF-Verzeichnisbaum-Picker) — bislang implizit/transitiv erwartet,
# jetzt explizit deklariert, da beides direkt von diesem Artefakt stammt.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }

# --- Termux-Vendoring ---
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
google-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-ext-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }
markwon-recycler = { group = "io.noties.markwon", name = "recycler", version.ref = "markwon" }
hidden-api-bypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenApiBypass" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidxPreference" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "androidxDrawerlayout" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidxViewpager2" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "androidxWindow" }

# --- Abhängigkeiten von build-logic (Convention-Plugins, siehe build-logic/convention) ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Code Quality Tools
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

# Convention-Plugins aus build-logic (ohne Version: kommen aus dem Included Build)
codeforge-android-application = { id = "codeforge.android.application" }
