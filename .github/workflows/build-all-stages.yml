name: Build All Stages (Kette)

# Startet build-bootstrap-repo.yml nacheinander für mehrere Gruppen aus apt-groups.json
# (ein Klick statt vieler Einzelläufe). Die Läufe sind absichtlich sequentiell:
# build-bootstrap-repo hält eine Concurrency-Gruppe und gh-pages darf nicht parallel beschrieben werden.
#
# Voraussetzungen: dieselben Secrets wie build-bootstrap-repo.yml (secrets: inherit).

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "light = Gruppen A–F · heavy = JDKs, LLVM, Dart, rust-analyzer · all = beides"
        required: true
        default: "light"
        type: choice
        options: [light, heavy, all]
      only:
        description: "Optional: nur diese Gruppen (Komma, z. B. A-leicht-jvm,D-leicht-lsp); überschreibt preset"
        required: false
        default: ""
        type: string
      mode:
        description: "Modus für jeden Lauf (add = ergänzen, empfohlen)"
        required: true
        default: "add"
        type: choice
        options: [add, auto]
      archs:
        description: "Architekturen, Komma getrennt (Gruppen mit eigenem archs-Feld nutzen dieses)"
        required: true
        default: "aarch64,arm"
        type: string
      publish:
        description: "Nach jedem Lauf nach gh-pages veröffentlichen"
        required: true
        default: false
        type: boolean
      stop_on_error:
        description: "Kette abbrechen, sobald eine Gruppe fehlschlägt"
        required: true
        default: true
        type: boolean
      keep_going:
        description: "Innerhalb einer Gruppe bei fehlgeschlagenem Paket weiterbauen"
        required: true
        default: true
        type: boolean
      fail_on_skipped:
        description: "Lauf mit Fehler beenden, wenn ein Paket wegen Fehlern oder Prefix-Check übersprungen wurde"
        required: false
        default: false
        type: boolean
      force_publish:
        description: "Veröffentlichung trotz Überschreitung der Pool-Abbruchschwelle erzwingen"
        required: false
        default: false
        type: boolean
      target_repo:
        description: "Ziel-Repo für gh-pages"
        required: false
        default: "scto/terminal-packages-codeforge"
        type: string

permissions:
  contents: read

concurrency:
  group: build-all-stages
  cancel-in-progress: false

jobs:
  groups:
    name: Gruppen planen
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Matrix aus apt-groups.json
        id: plan
        env:
          IN_PRESET: ${{ inputs.preset }}
          IN_ONLY: ${{ inputs.only }}
        run: bash .github/scripts/plan-apt-groups.sh

  build:
    name: ${{ matrix.name }}
    needs: groups
    strategy:
      max-parallel: 1
      fail-fast: ${{ inputs.stop_on_error }}
      matrix: ${{ fromJSON(needs.groups.outputs.matrix) }}
    uses: ./.github/workflows/build-bootstrap-repo.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ matrix.stage }}
      repo_packages: ${{ matrix.repo_packages }}
      archs: ${{ matrix.archs || inputs.archs }}
      keep_going: ${{ inputs.keep_going }}
      fail_on_skipped: ${{ inputs.fail_on_skipped }}
      publish: ${{ inputs.publish }}
      target_repo: ${{ inputs.target_repo }}
      run_label: ${{ matrix.name }}
      force_publish: ${{ inputs.force_publish }}
    secrets: inherit

  summary:
    name: Zusammenfassung
    needs: [groups, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: deb-Artefakte für Diagnose herunterladen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: debs-*
          path: all-debs
          merge-multiple: false

      - name: Ergebnis
        env:
          RESULT: ${{ needs.build.result }}
          MATRIX: ${{ needs.groups.outputs.matrix }}
          FAIL_ON_SKIPPED: ${{ inputs.fail_on_skipped }}
        run: |
          has_skipped=false
          {
            echo "### Kette: $RESULT"
            echo "Gruppen: $(jq -r '[.include[].name]|join(" → ")' <<<"$MATRIX")"
            echo
            if [ -d all-debs ]; then
              echo "### Status / verworfene Pakete pro Gruppe:"
              for d in all-debs/*; do
                [ -d "$d" ] || continue
                grp="$(basename "$d")"
                fails="$(cat "$d"/failed-packages-*.txt "$d"/failed-packages.txt 2>/dev/null | sort -u || true)"
                if [ -n "$fails" ]; then
                  has_skipped=true
                  echo "#### ⚠️ $grp: Verworfene / fehlgeschlagene Pakete:"
                  printf '%s\n' "$fails" | sed 's/^/- /'
                  echo "::warning title=Verworfene Pakete in $grp::$(echo "$fails" | tr '\n' ', ')"
                else
                  echo "- **$grp**: alle Pakete gebaut / keine verworfen"
                fi
              done
            else
              echo "Einzelergebnisse stehen in den Jobs 'build / …' (Matrix-Einträge)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            echo "Kette nicht erfolgreich: $RESULT"
            exit 1
          fi
          if [ "$has_skipped" = true ] && [ "$FAIL_ON_SKIPPED" = true ]; then
            echo "fail_on_skipped aktiv und es wurden Pakete verworfen!"
            exit 1
          fi
