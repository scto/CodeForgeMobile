# Statistik des Stores (Downloads + Bewertungen) → stats.json; die Website liest sie beim Laden.
# Täglich kurz nach Mitternacht (Schweiz, Winterzeit) und sofort nach jeder Bewertung.
name: Store-Statistik

on:
  schedule:
    - cron: "17 23 * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
  workflow_run:
    workflows: ["Store-Pakete"]
    types: [completed]

permissions:
  contents: write
  issues: read

concurrency:
  group: store-stats
  cancel-in-progress: false

jobs:
  stats:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'rating')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statistik berechnen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats.py
      - name: Speichern
        run: |
          git config user.name "codeforge-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Statistik $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
