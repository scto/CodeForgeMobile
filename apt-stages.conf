# Etappen für den Workflow "Build Bootstraps & APT-Repo" (Eingabe "stage").
# Format:  name | pakete (Komma) | flags (Leerzeichen)
#   flags:  single-arch   nur EINE Architektur bauen (für architekturunabhängige Pakete, die als *_all.deb in alle Architekturen gehen)
#           nodeps=all    Pakete ohne Abhängigkeiten bauen (build-package.sh -s) – nur für Pakete ohne BUILD_DEPENDS
#           nodeps=a,b    dasselbe nur für die genannten Pakete
# Eine Etappe soll pro Architektur deutlich unter 6 Stunden bleiben (GitHub-Limit je Job). Abhängigkeiten werden mit gebaut,
# außer bei nodeps. Unterpakete (clang, curl, xz-utils, protobuf, aidl, aapt2 …) entstehen beim Bau des Elternpakets
# (libllvm, libcurl, liblzma, libprotobuf, aapt) – deshalb stehen hier die Elternpakete.
# Eigene Etappen einfach als neue Zeile ergänzen.
#
# Reihenfolge: die Etappen sind unabhängig, jede ergänzt das bestehende Repo.
00-codeforge|codeforge-env|single-arch nodeps=all
01-jdk17|openjdk-17|
02-jdk21|openjdk-21|
03-jdk25|openjdk-25|
04-jvm-tools|gradle,kotlin,maven,libjansi,ant,apksigner,d8,dx,ecj|single-arch nodeps=all
05-android-tools|libprotobuf,aapt|
06-dev-core|git,git-lfs,zip,unzip,tar,libcurl,wget,liblzma,7zip,jq,ninja,make,cmake,openssh|
07-utils|vim,nano,ripgrep,fd,tmux,patch,diffutils,findutils,binutils,which,libmagic,libsqlite,bash-completion|
08-python|python|
09-nodejs|nodejs,npm|
10-llvm-clang|libllvm|
11-dart|dart|
12-lsp-misc|gopls,taplo,ruff|nodeps=gopls
# --- ergänzt 2026-10-16 (Namen gegen termux-packages geprüft; 00-codeforge braucht das Rezept packages/codeforge-env im Fork) ---
13-pure-tools|python-pip,yarn,autoconf,automake|single-arch nodeps=all
14-ide-tools|neocmakelsp,esbuild,pnpm,shellcheck|
15-rust-analyzer|rust-analyzer|
16-native-dev|pkg-config,libtool,flex,bison,ccache,patchelf,strace|
17-debug-misc|gdb,android-tools,gh,rsync,xmlstarlet|
