syntax = "proto3";

option java_package = "com.codeforge.core.datastore.proto";
option java_multiple_files = true;

message AppSettings {
  ThemeConfig theme = 1;
  TerminalConfig terminal = 2;
  EditorConfig editor = 3;
  bool onboarding_completed = 4;
  WizardConfig wizard = 5;
  FileHeaderConfig file_header = 6;
  MigrationConfig migration = 7;
  DebugConfig debug = 8;
  GitConfig git = 9;
  FileTreeConfig file_tree = 10;
  ComposePreviewConfig compose_preview = 11;
}

message ComposePreviewConfig {
  // Invertiert gespeichert: Standard (false) = kompilierte Vorschau (bisheriger Weg), true = interpretiert.
  bool interpreted = 1;
}

message FileTreeConfig {
  int32 sort_mode = 1;   // 0 gruppiert (versteckte Ordner, Ordner, versteckte Dateien, Dateien), 1 gemischt
  int32 sort_by = 2;     // 0 Name, 1 Typ, 2 Größe, 3 Änderungsdatum
  bool descending = 3;
  int32 view = 4;        // 0 Dateien, 1 Projekt, 2 Modul (Android)
  bool hide_hidden = 5;  // negiert gespeichert: Standard (false) = versteckte Dateien anzeigen
}

message GitConfig {
  // Alle Schalter invertiert gespeichert: Standard (false) = Funktion AN, auch für bestehende Installationen.
  bool gutter_markers_disabled = 1;
  bool conflict_detection_disabled = 2;
  bool file_name_colors_disabled = 3;
}

message ThemeConfig {
  ThemeMode mode = 1;
  string color_scheme_id = 2;
  bool use_dynamic_color = 3;
  CustomPalette custom_palette = 4;
  // Schlüssel eines Icon-Themes aus einem Plugin ("ext:<pluginId>/<themeId>"); leer = App-Standardicons.
  string icon_theme_id = 5;
  // Schlüssel eines Sprachpakets aus einem Plugin ("ext:<pluginId>/<locale>"); leer = Sprache des Systems/der App.
  string language_pack_id = 6;
}

message CustomPalette {
  string primary = 1;
  string secondary = 2;
  string tertiary = 3;
}

enum ThemeMode {
  SYSTEM = 0;
  LIGHT = 1;
  DARK = 2;
}

message TerminalConfig {
  // Feld 1 (default_distro) entfernt: Termux kennt kein Multi-Distro. Nummer nicht wiederverwenden.
  reserved 1;
  reserved "default_distro";
  int32 font_size = 2;
  bool use_compact_terminal = 3;
}

message EditorConfig {
  int32 tab_size = 1;
  bool use_tree_sitter = 2;
  string textmate_theme = 3;
  string lsp_server_path = 4;
  int32 font_size = 5;
  string font_family = 6;
  bool word_wrap = 7;
  bool show_non_printable_chars = 8;
  bool sticky_scroll_enabled = 9;
  bool magnifier_enabled = 10;
  bool symbol_pair_autocomplete_enabled = 11;
  bool minimap_enabled = 12;
  bool rainbow_brackets_enabled = 13;
  bool pinch_to_zoom_enabled = 14;
  bool desktop_shortcuts_enabled = 15;
  bool format_on_save_kotlin = 16;
  bool format_on_save_java = 17;
  bool format_on_save_xml = 18;
  bool format_on_save_json = 19;
  int32 lsp_max_concurrent_sessions = 20;
  int32 lsp_idle_timeout_minutes = 21;
  // Invertiert gespeichert, damit "an" (Standard) auch für bestehende Installationen gilt (Proto-Default false).
  bool project_indexing_disabled = 22;
  // Invertiert gespeichert (Standard = an, auch für bestehende Installationen).
  bool line_numbers_hidden = 23;
  bool pin_line_numbers = 24;
  bool cursor_animation_disabled = 25;
  // Zeilenabstand in Prozent (0 = Standard 100).
  int32 line_spacing_percent = 26;
  bool read_only_default = 27;
  bool txt_word_wrap = 28;
  // Invertiert gespeichert (Standard = an).
  bool color_previews_disabled = 29;
  bool disable_soft_keyboard_with_hardware_keyboard = 30;
  bool keyboard_suggestions = 31;
  // Eingebaute Konverter, invertiert gespeichert (Standard = an): Java→Kotlin und XML→Compose.
  bool j2k_disabled = 32;
  bool x2c_disabled = 33;
  // Wortauswahl (Doppeltipp, langes Drücken) über ICU-Wortgrenzen; invertiert gespeichert (Standard = an).
  bool icu_word_selection_disabled = 34;
  // Invertiert gespeichert (Standard = an): Ligaturen, leere Zeile per Backspace, Tab-Breite per Backspace.
  bool font_ligatures_disabled = 35;
  // false (Standard) = Soft-Tab: Leerzeichen statt \t.
  bool hard_tabs = 36;
  bool delete_empty_line_fast_disabled = 37;
  bool backspace_deletes_tab_disabled = 38;
  // Code-Faltung (sora-editor-Fork): standardmäßig an.
  bool code_folding_disabled = 39;
  // Tastenbelegung: Aktions-ID -> Akkord ("Ctrl+Shift+P"); leerer Wert = Belegung entfernt.
  map<string, string> keymap_overrides = 40;
  // Zweimal Umschalt öffnet die Befehlspalette (Search Everywhere).
  bool double_shift_palette = 41;
  // Symbolleiste über der Tastatur als JSON (leer = Standardliste).
  string symbol_bar_json = 42;
  bool symbol_bar_hidden = 43;
  // Sprachspezifische Symbole anhängen; invertiert gespeichert (Standard = an).
  bool symbol_bar_language_extras_disabled = 44;
  // sora-editor: Darstellung (invertiert gespeichert, Standard = an)
  bool current_line_highlight_disabled = 45;
  bool indent_guides_disabled = 46;
  bool cursor_blink_disabled = 47;
  // 0 = Bewegen, 1 = Überblenden, 2 = Skalieren
  int32 cursor_animation_style = 48;
  bool scrollbars_hidden = 49;
  // 0 = Standard (3)
  int32 sticky_scroll_max_lines = 50;
  bool line_number_click_selects_line = 51;
  // 0 = Wellenlinie, 1 = Linie, 2 = Doppellinie, 3 = keine
  int32 diagnostic_style = 52;
  bool inlay_hints_disabled = 53;
  // 0 = automatisch, 1 = immer, 2 = nie
  int32 mouse_mode = 54;
  bool fast_scroll_tip_hidden = 55;
  bool fold_marks_as_lines = 56;
  // Zeichenabstand in Hundertstel em
  int32 letter_spacing_percent = 57;
  // Lineal nach Spalte (0 = aus)
  int32 ruler_column = 58;
  bool format_on_paste = 59;
  // 0 = Tropfen, 1 = seitlicher Tropfen
  int32 selection_handle_style = 60;
}


message WizardConfig {
  string last_save_location = 1;
  string language = 2;      // "KOTLIN" | "JAVA" (leer = KOTLIN)
  int32 min_sdk = 3;        // 0 = Standard
  bool use_groovy_dsl = 4;  // false = Kotlin DSL
  bool skip_git_init = 5;   // false = neue Projekte mit git init anlegen
}

message FileHeaderConfig {
  bool enabled = 1;
  string author = 2;
  map<string, string> custom_templates = 3;
}

message MigrationConfig {
  repeated string j2k_dismissed_projects = 1;
  repeated string x2c_dismissed_projects = 2;
}

message DebugConfig {
  // Standard (false) = Protokollierung AN. Negiert gespeichert, damit der Proto-Default (false)
  // ohne Migration "an" bedeutet.
  bool log_disabled = 1;
  // Höchstzahl Log-Dateien; 0 = Standard (20).
  int32 log_max_files = 2;
  // Abgeschlossene Log-Dateien als .zip ablegen.
  bool log_compress = 3;
}
