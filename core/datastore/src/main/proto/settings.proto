syntax = "proto3";

option java_package = "com.codeforge.core.datastore.proto";
option java_multiple_files = true;

message AppSettings {
  ThemeConfig theme = 1;
  TerminalConfig terminal = 2;
  EditorConfig editor = 3;
  bool onboarding_completed = 4;
  WizardConfig wizard = 5;
  FileHeaderConfig file_header = 6;
  MigrationConfig migration = 7;
}

message ThemeConfig {
  ThemeMode mode = 1;
  string color_scheme_id = 2;
  bool use_dynamic_color = 3;
  CustomPalette custom_palette = 4;
}

message CustomPalette {
  string primary = 1;
  string secondary = 2;
  string tertiary = 3;
}

enum ThemeMode {
  SYSTEM = 0;
  LIGHT = 1;
  DARK = 2;
}

message TerminalConfig {
  // Feld 1 (default_distro) entfernt: Termux kennt kein Multi-Distro. Nummer nicht wiederverwenden.
  reserved 1;
  reserved "default_distro";
  int32 font_size = 2;
  bool use_compact_terminal = 3;
}

message EditorConfig {
  int32 tab_size = 1;
  bool use_tree_sitter = 2;
  string textmate_theme = 3;
  string lsp_server_path = 4;
  int32 font_size = 5;
  string font_family = 6;
  bool word_wrap = 7;
  bool show_non_printable_chars = 8;
  bool sticky_scroll_enabled = 9;
  bool magnifier_enabled = 10;
  bool symbol_pair_autocomplete_enabled = 11;
  bool minimap_enabled = 12;
  bool rainbow_brackets_enabled = 13;
  bool pinch_to_zoom_enabled = 14;
  bool desktop_shortcuts_enabled = 15;
  bool format_on_save_kotlin = 16;
  bool format_on_save_java = 17;
  bool format_on_save_xml = 18;
  bool format_on_save_json = 19;
  int32 lsp_max_concurrent_sessions = 20;
  int32 lsp_idle_timeout_minutes = 21;
}


message WizardConfig {
  string last_save_location = 1;
  string language = 2;      // "KOTLIN" | "JAVA" (leer = KOTLIN)
  int32 min_sdk = 3;        // 0 = Standard
  bool use_groovy_dsl = 4;  // false = Kotlin DSL
  bool skip_git_init = 5;   // false = neue Projekte mit git init anlegen
}

message FileHeaderConfig {
  bool enabled = 1;
  string author = 2;
  map<string, string> custom_templates = 3;
}

message MigrationConfig {
  repeated string j2k_dismissed_projects = 1;
  repeated string x2c_dismissed_projects = 2;
}
