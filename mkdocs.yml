site_name: CodeForge Mobile
site_description: Dokumentation der Android-IDE CodeForge Mobile
copyright: 'CodeForge Mobile · gewidmet <a href="https://scto.github.io/CodeForgeMobile/basti/">Basti</a> 🐾'
repo_url: https://github.com/scto/CodeForgeMobile
docs_dir: docs
site_dir: site
theme:
  name: material
  custom_dir: overrides
  language: de
  # Design wie der CodeForge Store: Farben, Formen und Schrift kommen aus stylesheets/store.css (system-ui statt Webfont)
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dunkles Design }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Helles Design }
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
extra_css:
  - stylesheets/store.css
extra_javascript:
  - javascripts/portal.js
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Start: index.md
  - Store: store.md
  - APT-Repo: apt.md
  - Dokumentation:
      - Anwenderhandbuch: user/Anwenderhandbuch.md
      - User Guide: user/UserGuide.md
      - Entwicklerhandbuch: dev/DeveloperGuide.md
      - Plugins entwickeln: dev/PluginDevelopment.md
      - Release-Ablauf: dev/ReleaseProcess.md
      - Release-Signatur: dev/Signing.md
      - Modulgraph: dev/module-graph.md
      - APK: apk/APK-Dokumentation.md
      - Release Notes 3.0.2: release-notes/3.0.2.md
      - Release Notes 3.0.2 (EN): release-notes/3.0.2.en.md
      - Release Notes 3.0.1: release-notes/3.0.1.md
      - Release Notes 3.0.1 (EN): release-notes/3.0.1.en.md
      - Release Notes 3.0.0: release-notes/3.0.0.md
      - Release Notes 3.0.0 (EN): release-notes/3.0.0.en.md
  - API-Referenz: api/index.html
  - Basti: basti.md
# Dateien in docs/, die nicht zur Seite gehören (Skripte, Rohberichte ohne Navigation) erzeugen nur Hinweise
validation:
  links: { not_found: ignore, absolute_links: ignore, unrecognized_links: ignore }
