## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
 #Wed Jul 14 11:57:39 IST 2021
 
# Gradle
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=en -Duser.country=US
# org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=1
#
# Android
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
android.enableAapt2Daemon=true
android.injected.testOnly=false
android.builder.sdkDownload=true
android.defaults.buildfeatures.resvalues=true
android.disallowKotlinSourceSets=false
android.nonTransitiveRClass=true
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=out-of-process
kotlin.jvm.target.validation.mode=warning

# System
systemProp.user.country=US
systemProp.user.language=en
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# App
compileSdkVersion=36
targetSdkVersion=28
minSdkVersion=23
ndkVersion=29.0.14033849

markwonVersion=4.6.2