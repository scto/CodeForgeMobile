# Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
# Jedes Modul sieht nur seine eigene R-Klasse (z. B. com.codeforge.core.resources.R für Texte)
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Terminal-Bootstrap (build-logic: codeforge.terminal.bootstrap) – siehe Plugin-KDoc:
# Eigener Bootstrap (Prefix /data/data/com.codeforge.app/files/usr), Release bootstrap-2026.10.22 in scto/terminal-packages-codeforge
codeforgeBootstrapVersion=2026.10.22
codeforgeBootstrapUrlTemplate=https://github.com/scto/terminal-packages-codeforge/releases/download/bootstrap-%1$s/bootstrap-%2$s.zip
codeforgeBootstrapSha256.aarch64=0cde7b2a0fe471a6709b69d0fd98611df8654bfff9309f0d078c325a7cd0cf26
codeforgeBootstrapSha256.arm=dad3504039f8924562d5dfb338513a17aae841d93656311abf25375ce4d9cf44
#codeforgeBootstrapSkip=true
