# Gradle
# Locale und Kodierung gehören in die Startargumente des Daemons: als systemProp.* setzt Gradle sie erst,
# wenn die JVM Locale/Kodierung schon festgelegt hat – dann wirken sie nicht mehr.
# Englisch + UTF-8 halten die Compiler-/Gradle-Ausgabe einheitlich (die App wertet sie aus).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
# 30 Minuten: auf dem Handy belegt ein ruhender Daemon sonst stundenlang rund 5 GB.
# Gerätespezifische Werte (jvmargs, workers.max, idletimeout) lassen sich in ~/.gradle/gradle.properties
# überschreiben – die hat Vorrang vor dieser Datei.
org.gradle.daemon.idletimeout=1800000
org.gradle.workers.max=4
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
# Jedes Modul sieht nur seine eigene R-Klasse (z. B. com.codeforge.core.resources.R für Texte)
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

